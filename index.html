<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Digital Mind Balance Analyzer</title>
  <style>
    body {
      font-family: Arial;
      margin: 24px;
      max-width: 720px;
      background: #f7f7fb;
    }

    input, button {
      padding: 8px;
      margin: 4px;
    }

    #list, #result, #status {
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
      white-space: pre-line;
      background: white;
    }

    .row {
      display: flex;
      gap: 6px;
    }
  </style>
</head>

<body>

<h2>Digital Mind Balance Analyzer</h2>
<p>Catat aktivitas harian untuk melihat kondisi stimulasi mental & digital balance.</p>

<div class="row">
  <input id="act" placeholder="contoh: TikTok / Belajar / Meditasi">
  <input id="min" type="number" placeholder="menit">
  <button onclick="tambah()">Tambah</button>
</div>

<button onclick="analisis()">Analisis Kondisi Mental</button>

<p id="total">Total: 0 menit</p>

<h3>Aktivitas</h3>
<div id="list">Belum ada data</div>

<h3>Status Mental</h3>
<div id="result">Belum dianalisis</div>

<h3>Visualisasi Pikiran</h3>
<button onclick="generateImage()">Generate Gambar Otak</button>
<div id="status">Belum ada gambar</div>

<img id="img" style="max-width:320px; margin-top:12px; display:none;">

<script src="API/analyze.js"></script>

</body>
</html>
