<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Digital Mind Balance Analyzer</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: radial-gradient(circle at top, #0f172a, #0b1220);
      color: #e5e7eb;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 820px;
      margin-top: 40px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 16px;
    }

    .title {
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    input {
      background: rgba(255,255,255,0.08) !important;
      border: 1px solid rgba(255,255,255,0.15) !important;
      color: white !important;
    }

    input::placeholder {
      color: white;
    }

    #list, #result, #status {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 10px;
      white-space: pre-line;
    }

    .btn-glow {
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      border: none;
      color: white;
    }

    .btn-glow:hover {
      opacity: 0.9;
    }

    .section-title {
      margin-top: 20px;
      font-size: 14px;
      color: #94a3b8;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="text-center mb-4">
    <h2 class="title">Digital Mind Balance Analyzer</h2>
    <p class="text-secondary">
      Monitor stimulasi digital & kondisi mental ringan berbasis aktivitas harian
    </p>
  </div>

  <!-- INPUT CARD -->
  <div class="card p-3 mb-3">

    <div class="row g-2">
      <div class="col-md-7">
        <input id="act" class="form-control" placeholder="TikTok / Belajar / Meditasi">
      </div>

      <div class="col-md-3">
        <input id="min" type="number" class="form-control" placeholder="menit">
      </div>

      <div class="col-md-2 d-grid">
        <button onclick="tambah()" class="btn btn-glow">Tambah</button>
      </div>
    </div>

  </div>

  <!-- ACTION -->
  <div class="d-grid mb-3">
    <button onclick="analisis()" class="btn btn-outline-info">
      Analisis Kondisi Mental
    </button>
  </div>

  <!-- TOTAL -->
  <div class="text-center mb-3">
    <span class="badge bg-info text-dark fs-6">
      Total: <span id="total">0 menit</span>
    </span>
  </div>

  <!-- LIST -->
  <div class="section-title">AKTIVITAS</div>
  <div id="list" class="mb-3">Belum ada data</div>

  <!-- RESULT -->
  <div class="section-title">STATUS MENTAL</div>
  <div id="result" class="mb-3">Belum dianalisis</div>

  <!-- IMAGE -->
  <div class="section-title">VISUALISASI PIKIRAN</div>

  <div class="d-grid mb-2">
    <button onclick="generateImage()" class="btn btn-outline-light">
      Generate Gambar Otak
    </button>
  </div>

  <div id="status" class="mb-3">Belum ada gambar</div>

  <div class="text-center">
    <img id="img" style="max-width:320px; display:none; border-radius:12px;">
  </div>

</div>

<!-- JS -->
<script src="API/analyze.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
